<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c35"><title>チャッピー単語帳</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#19332e;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:20px 16px 45px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:23px;margin:8px 0}small,.muted{color:#64756d}button,select{font:inherit}button{border:0;border-radius:12px;padding:13px 15px;background:#e5ede8;color:#193c32;font-weight:650;cursor:pointer}button:active{transform:scale(.98)}button.primary{background:#146d57;color:white}button.secondary{background:white;border:1px solid #d1ddd4}button:disabled{opacity:.45}.panel{background:white;border:1px solid #e0e9e1;border-radius:18px;padding:15px;margin-top:16px;box-shadow:0 3px 12px #123c3510}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls>*{flex:1}select{min-width:0;border:1px solid #d1ddd4;border-radius:10px;background:#fff;padding:10px}.stat{display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px}.card{min-height:275px;border-radius:18px;background:linear-gradient(145deg,#e6f3e8,#f7faf3);border:1px solid #d2e3d5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px 18px;gap:20px;cursor:pointer;user-select:none}.card .word{font-size:clamp(26px,7vw,38px);font-weight:750;overflow-wrap:anywhere;line-height:1.35}.tag{font-size:13px;color:#60766b}.hint{font-size:12px;color:#6c8175}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.actions button{min-height:53px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row button{white-space:nowrap}.file{display:none}.foot{font-size:12px;color:#657a6c;line-height:1.6}.pill{border-radius:20px;background:#e8f0e9;padding:5px 9px;font-size:12px}#message{font-size:13px;min-height:20px;color:#146d57} </style></head><body><main>
<header><div><h1>🌿 チャッピー単語帳</h1><small>農業 × Minecraft</small></div><span class="pill" id="total">50語</span></header>
<section class="panel"><div class="controls"><select id="category" aria-label="分野"><option value="all">すべての分野</option><option value="農業">農業</option><option value="Minecraft">Minecraft</option></select><select id="filter" aria-label="学習対象"><option value="all">すべての単語</option><option value="new">未学習のみ</option><option value="missed">復習のみ</option><option value="known">覚えた単語</option></select></div><div class="controls" style="margin-top:10px"><select id="direction" aria-label="出題方向"><option value="en">英語 → 日本語</option><option value="ja">日本語 → 英語</option><option value="mix">両方向ランダム</option></select><button id="shuffle" class="secondary">🔀 シャッフル</button></div></section>
<section class="panel"><div class="stat"><span id="progress">1 / 50</span><span id="stats">未学習 50 · 復習 0 · 覚えた 0</span></div><div id="card" class="card" role="button" tabindex="0" aria-label="カードを裏返す"><span id="tag" class="tag">農業</span><div id="word" class="word">harvest</div><span id="hint" class="hint">タップして答えを見る</span></div><div class="controls" style="margin-top:12px"><button id="speak" class="secondary">🔊 英語を聞く</button><button id="flip" class="secondary">↔ 裏返す</button></div><div class="actions"><button id="miss">✕ まだ覚えていない</button><button id="know" class="primary">✓ 覚えた</button></div><div class="controls" style="margin-top:10px"><button id="prev" class="secondary">← 前へ</button><button id="next" class="secondary">次へ →</button></div></section>
<section class="panel"><div class="row"><div><strong>📂 単語ファイル</strong><div class="foot">iCloud Driveのwords.csvを選択して読み込み</div></div><button id="import" class="secondary">CSVを読み込む</button></div><input id="file" class="file" type="file" accept=".csv,text/csv,text/plain"><p id="message">初期データ50件を読み込みました。</p><div class="row"><button id="export" class="secondary">現在のCSVを保存</button><button id="reset" class="secondary">学習履歴をリセット</button></div></section><p class="foot">※ 学習履歴はこのブラウザ内に保存します。CSVの読み込みは元ファイルを変更しません。iPhoneでは次回起動時も初期データから始まる場合があるため、編集済みCSVは再度選択してください。</p></main>
<script>
const starter=[{"id": "1", "english": "harvest", "japanese": "収穫する", "category": "農業"}, {"id": "2", "english": "sow seeds", "japanese": "種をまく", "category": "農業"}, {"id": "3", "english": "plant seedlings", "japanese": "苗を植える", "category": "農業"}, {"id": "4", "english": "water the plants", "japanese": "植物に水をやる", "category": "農業"}, {"id": "5", "english": "irrigation", "japanese": "灌水・灌漑", "category": "農業"}, {"id": "6", "english": "fertilizer", "japanese": "肥料", "category": "農業"}, {"id": "7", "english": "soil", "japanese": "土壌", "category": "農業"}, {"id": "8", "english": "greenhouse", "japanese": "温室・ハウス", "category": "農業"}, {"id": "9", "english": "field", "japanese": "畑", "category": "農業"}, {"id": "10", "english": "seedling", "japanese": "苗", "category": "農業"}, {"id": "11", "english": "prune", "japanese": "剪定する", "category": "農業"}, {"id": "12", "english": "weed", "japanese": "雑草・草取りをする", "category": "農業"}, {"id": "13", "english": "pest", "japanese": "害虫", "category": "農業"}, {"id": "14", "english": "aphid", "japanese": "アブラムシ", "category": "農業"}, {"id": "15", "english": "whitefly", "japanese": "コナジラミ", "category": "農業"}, {"id": "16", "english": "thrips", "japanese": "アザミウマ", "category": "農業"}, {"id": "17", "english": "downy mildew", "japanese": "べと病", "category": "農業"}, {"id": "18", "english": "spray the crops", "japanese": "作物に薬剤を散布する", "category": "農業"}, {"id": "19", "english": "check the leaves", "japanese": "葉を確認する", "category": "農業"}, {"id": "20", "english": "fresh herbs", "japanese": "生のハーブ", "category": "農業"}, {"id": "21", "english": "basil", "japanese": "バジル", "category": "農業"}, {"id": "22", "english": "peppermint", "japanese": "ペパーミント", "category": "農業"}, {"id": "23", "english": "rosemary", "japanese": "ローズマリー", "category": "農業"}, {"id": "24", "english": "the soil is dry", "japanese": "土が乾いている", "category": "農業"}, {"id": "25", "english": "ready to harvest", "japanese": "収穫できる状態", "category": "農業"}, {"id": "26", "english": "crafting table", "japanese": "作業台", "category": "Minecraft"}, {"id": "27", "english": "furnace", "japanese": "かまど", "category": "Minecraft"}, {"id": "28", "english": "pickaxe", "japanese": "ツルハシ", "category": "Minecraft"}, {"id": "29", "english": "shovel", "japanese": "シャベル", "category": "Minecraft"}, {"id": "30", "english": "iron ingot", "japanese": "鉄インゴット", "category": "Minecraft"}, {"id": "31", "english": "diamond", "japanese": "ダイヤモンド", "category": "Minecraft"}, {"id": "32", "english": "redstone", "japanese": "レッドストーン", "category": "Minecraft"}, {"id": "33", "english": "torch", "japanese": "松明", "category": "Minecraft"}, {"id": "34", "english": "chest", "japanese": "チェスト", "category": "Minecraft"}, {"id": "35", "english": "villager", "japanese": "村人", "category": "Minecraft"}, {"id": "36", "english": "creeper", "japanese": "クリーパー", "category": "Minecraft"}, {"id": "37", "english": "zombie", "japanese": "ゾンビ", "category": "Minecraft"}, {"id": "38", "english": "skeleton", "japanese": "スケルトン", "category": "Minecraft"}, {"id": "39", "english": "spawn point", "japanese": "スポーン地点", "category": "Minecraft"}, {"id": "40", "english": "survival mode", "japanese": "サバイバルモード", "category": "Minecraft"}, {"id": "41", "english": "build a house", "japanese": "家を建てる", "category": "Minecraft"}, {"id": "42", "english": "mine some iron", "japanese": "鉄を採掘する", "category": "Minecraft"}, {"id": "43", "english": "craft a sword", "japanese": "剣を作る", "category": "Minecraft"}, {"id": "44", "english": "plant wheat", "japanese": "小麦を植える", "category": "Minecraft"}, {"id": "45", "english": "feed the animals", "japanese": "動物に餌をやる", "category": "Minecraft"}, {"id": "46", "english": "sleep in a bed", "japanese": "ベッドで寝る", "category": "Minecraft"}, {"id": "47", "english": "light up the area", "japanese": "周囲を明るくする", "category": "Minecraft"}, {"id": "48", "english": "open the inventory", "japanese": "インベントリを開く", "category": "Minecraft"}, {"id": "49", "english": "watch out for creepers", "japanese": "クリーパーに気をつけて", "category": "Minecraft"}, {"id": "50", "english": "I need more wood.", "japanese": "もっと木材が必要だ。", "category": "Minecraft"}];let words=starter.slice(),history={};try{history=JSON.parse(localStorage.getItem('chappy_history_v1')||'{}')||{}}catch{}let queue=[],position=0,flipped=false,side='en';const $=id=>document.getElementById(id);const key=w=>String(w.id||w.english).trim()+':'+w.english.trim().toLowerCase();function save(){try{localStorage.setItem('chappy_history_v1',JSON.stringify(history))}catch{}}
function selectQueue(shuffle=false){let c=$('category').value,f=$('filter').value;queue=words.filter(w=>(c==='all'||w.category===c)&&(f==='all'||(f==='new'&&!history[key(w)])||(f==='missed'&&history[key(w)]==='missed')||(f==='known'&&history[key(w)]==='known')));if(shuffle)queue.sort(()=>Math.random()-.5);position=0;display()}
function display(){flipped=false;side=$('direction').value==='mix'?(Math.random()<.5?'en':'ja'):$('direction').value;let w=queue[position];$('total').textContent=words.length+'語';let known=words.filter(w=>history[key(w)]==='known').length,missed=words.filter(w=>history[key(w)]==='missed').length;$('stats').textContent=`未学習 ${words.length-known-missed} · 復習 ${missed} · 覚えた ${known}`;$('progress').textContent=w?`${position+1} / ${queue.length}`:'0 / 0';$('tag').textContent=w?w.category:'該当する単語なし';$('word').textContent=w?(side==='en'?w.english:w.japanese):'条件を変えてください';$('hint').textContent=w?'タップして答えを見る':'';['miss','know','flip','speak','prev','next'].forEach(id=>$(id).disabled=!w)}
function flip(){let w=queue[position];if(!w)return;flipped=!flipped;$('word').textContent=side==='en'?(flipped?w.japanese:w.english):(flipped?w.english:w.japanese);$('hint').textContent=flipped?'タップして問題に戻る':'タップして答えを見る'}function move(delta){if(!queue.length)return;position=(position+delta+queue.length)%queue.length;display()}function mark(v){let w=queue[position];if(!w)return;history[key(w)]=v;save();if($('filter').value!=='all')selectQueue();else move(1)}
$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('miss').onclick=()=>mark('missed');$('know').onclick=()=>mark('known');$('speak').onclick=()=>{let w=queue[position];if(!w)return;if(!('speechSynthesis'in window)){alert('このブラウザは読み上げに対応していません');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w.english);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};['category','filter','direction'].forEach(id=>$(id).onchange=()=>selectQueue());$('shuffle').onclick=()=>selectQueue(true);
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let records=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(field);field=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))records.push(row);row=[];field=''}else field+=ch}if(quoted)throw Error('CSVの引用符が閉じていません');row.push(field);if(row.some(x=>x.trim()))records.push(row);if(!records.length)throw Error('CSVが空です');let heads=records.shift().map(x=>x.trim().toLowerCase());let en=heads.indexOf('english'),ja=heads.indexOf('japanese'),id=heads.indexOf('id'),cat=heads.indexOf('category');if(en<0||ja<0)throw Error('english,japanese列が必要です');let result=records.map((r,i)=>({id:id<0?'':(r[id]||'').trim(),english:(r[en]||'').trim(),japanese:(r[ja]||'').trim(),category:cat<0?'その他':((r[cat]||'その他').trim()||'その他')})).filter(w=>w.english&&w.japanese);if(!result.length)throw Error('有効な単語がありません');return result}
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let loaded=parseCSV(await f.text());words=loaded;let categories=[...new Set(words.map(w=>w.category))];$('category').innerHTML='<option value="all">すべての分野</option>';for(let c of categories){let o=document.createElement('option');o.value=c;o.textContent=c;$('category').appendChild(o)}$('filter').value='all';selectQueue();$('message').textContent=`${f.name} から ${words.length}件を読み込みました。`}catch(err){$('message').textContent='読み込み失敗: '+err.message}e.target.value=''};
$('export').onclick=()=>{let q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';let csv='\uFEFFid,english,japanese,category\r\n'+words.map(w=>[w.id,w.english,w.japanese,w.category].map(q).join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='words.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('reset').onclick=()=>{if(confirm('覚えた・復習中の記録をすべて消しますか？')){history={};save();selectQueue()}};selectQueue();
</script></body></html>
